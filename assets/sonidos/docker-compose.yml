services:
  ctf-suid-lab:
    # Imagen a compilar
    build:
      context: .
      dockerfile: Dockerfile
    
    # Nombre del contenedor
    container_name: ctf-suid-lab-container
    
    # Etiquetas de identificación
    labels:
      - "com.ctf.lab=true"
      - "com.ctf.challenge=escalada-privilegios-suid"
      - "com.ctf.dificultad=principiante"
    
    # Red aislada
    networks:
      - ctf-lab-network
    
    # Mapeo de puertos (SSH para acceso)
    ports:
      - "2222:22"
    
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Variables de entorno
    environment:
      - RETO=SUID_FIND
      - DIFICULTAD=PRINCIPIANTE
      - LIMITE_TIEMPO=30m
    
    # Mantener contenedor activo
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  ctf-lab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
